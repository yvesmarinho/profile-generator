  plan-template.md:
    version: 1.2.0
    content: "---\ntemplate_version: \"1.2.0\"\nlast_updated: \"2026-04-23\"\nbreaking_changes:\
      \ false\n---\n\n# Implementation Plan: [FEATURE]\n\n**Branch**: `[###-feature-name]`\
      \ | **Date**: [DATE] | **Spec**: [link]\n**Input**: Feature specification from\
      \ `/specs/[###-feature-name]/spec.md`\n\n**Note**: This template is filled in\
      \ by the `/speckit.plan` command. See `.specify/templates/plan-template.md`\
      \ for the execution workflow.\n\n## Summary\n\n[Extract from feature spec: primary\
      \ requirement + technical approach from research]\n\n## Technical Context\n\n\
      <!--\n  Capture the technical environment and constraints for this feature.\n\
      \  Include language, frameworks, deployment target, and performance requirements.\n\
      -->\n\n### Stack & Infrastructure\n\n**Language/Version**: [e.g., Python 3.11,\
      \ Swift 5.9, Rust 1.75 or NEEDS CLARIFICATION]\n**Primary Dependencies**: [e.g.,\
      \ FastAPI, UIKit, LLVM or NEEDS CLARIFICATION]\n**Database**: [if applicable,\
      \ e.g., PostgreSQL 15, MongoDB 7, SQLite or N/A]\n**Testing Framework**: [e.g.,\
      \ pytest, XCTest, cargo test or NEEDS CLARIFICATION]\n**CI/CD Pipeline**: [e.g.,\
      \ GitHub Actions, GitLab CI, Jenkins or NEEDS CLARIFICATION]\n**Target Platform**:\
      \ [e.g., Linux server, iOS 15+, WASM, Docker or NEEDS CLARIFICATION]\n**Project\
      \ Type**: [e.g., library/cli/web-service/mobile-app/compiler/desktop-app or\
      \ NEEDS CLARIFICATION]\n\n### Performance & Scale\n\n**Performance Goals**:\
      \ [domain-specific, e.g., 1000 req/s, 10k lines/sec, 60 fps or NEEDS CLARIFICATION]\n\
      **Constraints**: [domain-specific, e.g., <200ms p95, <100MB memory, offline-capable\
      \ or NEEDS CLARIFICATION]\n**Scale/Scope**: [domain-specific, e.g., 10k users,\
      \ 1M LOC, 50 screens or NEEDS CLARIFICATION]\n**Monitoring**: [e.g., Prometheus,\
      \ Datadog, Application Insights or NEEDS CLARIFICATION]\n\n## Architecture Decision\
      \ Records *(mandatory for architectural features)*\n\n<!--\n  DOCUMENT KEY ARCHITECTURAL\
      \ DECISIONS using the ADR format:\n  - Status (Proposed, Accepted, Deprecated,\
      \ Superseded)\n  - Context (why this decision is needed)\n  - Decision (what\
      \ we chose)\n  - Rationale (why we chose it - trade-offs, constraints)\n  -\
      \ Consequences (positive/negative impacts)\n  - Alternatives Considered (what\
      \ we rejected and why)\n\n  Reference decisions from objetivo.yaml → decisoes_iniciais\
      \ if applicable.\n\n  For non-architectural features (e.g., simple bug fixes,\
      \ UI tweaks), you can skip this section\n  or add a note: \"No architectural\
      \ decisions required for this feature.\"\n-->\n\n### ADR-001: [Decision Title]\n\
      \n**Status**: [Proposed | Accepted | Deprecated | Superseded]\n**Date**: [YYYY-MM-DD]\n\
      **Context**: [What problem/question triggered this decision?]\n\n**Decision**:\
      \ [What did we decide?]\n\n**Rationale**: [Why did we decide this? What trade-offs\
      \ were considered?]\n\n**Consequences**:\n- ✅ **Positive**:\n  - [Benefit 1\
      \ - e.g., \"Reduces bundle size by 80%\"]\n  - [Benefit 2 - e.g., \"Improves\
      \ performance by 3x\"]\n- ⚠️ **Negative**:\n  - [Limitation 1 - e.g., \"Limited\
      \ to keyword-based search\"]\n  - [Limitation 2 - e.g., \"Requires manual index\
      \ rebuild\"]\n\n**Alternatives Considered**:\n1. **[Alternative A]**: [Why rejected\
      \ - e.g., \"Too complex for current needs\"]\n2. **[Alternative B]**: [Why rejected\
      \ - e.g., \"Requires external dependency (500MB+)\"]\n\n**Related Decisions**:\
      \ [ADR-XXX, ADR-YYY or \"None\"]\n**Supersedes**: [ADR-XXX if this replaces\
      \ an earlier decision or \"None\"]\n**Superseded by**: [ADR-XXX if this decision\
      \ was later replaced or \"None\"]\n\n---\n\n**Example ADR** (from IMP-51 - Session\
      \ Search System):\n\n### ADR-001: SQLite FTS5 for Session Search\n\n**Status**:\
      \ ✅ Accepted\n**Date**: 2026-04-05\n**Context**: Need full-text search across\
      \ session documentation (DAILY_ACTIVITIES, docs, specs)\n\n**Decision**: Use\
      \ SQLite FTS5 instead of embedding-based search (sentence-transformers)\n\n\
      **Rationale**:\n- **Pragmatism**: Zero external dependencies (sentence-transformers\
      \ = 500MB+ models)\n- **Performance**: FTS5 meets requirements (<0.1s for complex\
      \ queries)\n- **Simplicity**: Porter stemming + Unicode61 sufficient for PT-BR/EN\n\
      - **Cost**: SQLite FTS5 is built-in, no infrastructure cost\n\n**Consequences**:\n\
      - ✅ **Positive**:\n  - Fast indexing (~1s for 100 blocks)\n  - Small database\
      \ (~100KB for 100 blocks)\n  - Easy debugging (SQL queries are readable)\n-\
      \ ⚠️ **Negative**:\n  - Limited semantic search (keyword-based, not similarity-based)\n\
      \  - Queries with hyphens require quotes (e.g., `\"IMP-50\"`)\n\n**Alternatives\
      \ Considered**:\n1. **sentence-transformers + FAISS**: Rejected due to 500MB+\
      \ model overhead\n2. **Elasticsearch**: Rejected due to infrastructure complexity\n\
      3. **PostgreSQL pg_trgm**: Rejected because not built-in to Python\n\n**Related\
      \ Decisions**: None\n**Supersedes**: None\n**Superseded by**: None (may be revisited\
      \ if semantic search becomes necessary)\n\n---\n\n[Add more ADRs as needed -\
      \ number sequentially: ADR-002, ADR-003, etc.]\n\n## Constitution Check\n\n\
      *GATE: Must pass before Phase 0 research. Re-check after Phase 1 design.*\n\n\
      [Gates determined based on constitution file]\n\n## Project Structure\n\n###\
      \ Documentation (this feature)\n\n```text\nspecs/[###-feature]/\n├── plan.md\
      \              # This file (/speckit.plan command output)\n├── research.md \
      \         # Phase 0 output (/speckit.plan command)\n├── data-model.md      \
      \  # Phase 1 output (/speckit.plan command)\n├── quickstart.md        # Phase\
      \ 1 output (/speckit.plan command)\n├── contracts/           # Phase 1 output\
      \ (/speckit.plan command)\n└── tasks.md             # Phase 2 output (/speckit.tasks\
      \ command - NOT created by /speckit.plan)\n```\n\n### Source Code (repository\
      \ root)\n<!--\n  ACTION REQUIRED: Replace the placeholder tree below with the\
      \ concrete layout\n  for this feature. Delete unused options and expand the\
      \ chosen structure with\n  real paths (e.g., apps/admin, packages/something).\
      \ The delivered plan must\n  not include Option labels.\n-->\n\n```text\n# [REMOVE\
      \ IF UNUSED] Option 1: Single project (DEFAULT)\nsrc/\n├── models/\n├── services/\n\
      ├── cli/\n└── lib/\n\ntests/\n├── contract/\n├── integration/\n└── unit/\n\n\
      # [REMOVE IF UNUSED] Option 2: Web application (when \"frontend\" + \"backend\"\
      \ detected)\nbackend/\n├── src/\n│   ├── models/\n│   ├── services/\n│   └──\
      \ api/\n└── tests/\n\nfrontend/\n├── src/\n│   ├── components/\n│   ├── pages/\n\
      │   └── services/\n└── tests/\n\n# [REMOVE IF UNUSED] Option 3: Mobile + API\
      \ (when \"iOS/Android\" detected)\napi/\n└── [same as backend above]\n\nios/\
      \ or android/\n└── [platform-specific structure: feature modules, UI flows,\
      \ platform tests]\n```\n\n**Structure Decision**: [Document the selected structure\
      \ and reference the real\ndirectories captured above]\n\n## Complexity Tracking\n\
      \n> **Fill ONLY if Constitution Check has violations that must be justified**\n\
      \n| Violation | Why Needed | Simpler Alternative Rejected Because |\n|-----------|------------|-------------------------------------|\n\
      | [e.g., 4th project] | [current need] | [why 3 projects insufficient] |\n|\
      \ [e.g., Repository pattern] | [specific problem] | [why direct DB access insufficient]\
      \ |\n"
  spec-template.md:
    version: 2.2.0
    content: "---\ntemplate_version: \"2.2.0\"\nlast_updated: \"2026-04-23\"\nbreaking_changes:\
      \ false\n---\n\n# Feature Specification: [FEATURE NAME]\n\n**Feature ID**: [FEATURE_ID]\n\
      **Feature Branch**: `[###-feature-name]`\n**Created**: [DATE]\n**Status**: Draft\n\
      **Business Objective**: See [objetivo.yaml](./objetivo.yaml) (if exists)\n**Input**:\
      \ User description: \"$ARGUMENTS\"\n\n---\n\n## Business Context (from objetivo.yaml)\n\
      \n<!--\n  AUTO-POPULATED from objetivo.yaml if exists.\n  If objetivo.yaml doesn't\
      \ exist, summarize business context manually here.\n-->\n\n**Problem**: [Pulled\
      \ from objetivo.yaml → negocio.problema.descricao]\n\n**Value Proposition**:\
      \ [Pulled from objetivo.yaml → negocio.valor.objetivos_estrategicos]\n\n**Success\
      \ Metrics**: [Pulled from objetivo.yaml → negocio.valor.metricas_sucesso]\n\n\
      **Key Personas**: [Pulled from objetivo.yaml → produto.personas]\n\n**Critical\
      \ Journeys**: [Pulled from objetivo.yaml → produto.jornadas_criticas - P1 only]\n\
      \n**Initial Decisions**: [Pulled from objetivo.yaml → decisoes_iniciais]\n\n\
      ---\n\n## Performance Criteria *(added in v1.5.0)*\n\n<!--\n  Define non-functional\
      \ performance requirements for this feature.\n  These should be measurable and\
      \ testable.\n-->\n\n### Response Time Requirements\n\n- **API Endpoints**: p95\
      \ < 200ms, p99 < 500ms\n- **Page Load**: Initial render < 1s, interactive <\
      \ 2s\n- **Background Jobs**: Complete within [X] minutes/hours\n\n### Throughput\
      \ & Scalability\n\n- **Peak Load**: Handle [X] requests/second sustained\n-\
      \ **Concurrent Users**: Support [X] simultaneous users\n- **Data Volume**: Process\
      \ [X] records without degradation\n\n### Availability & Reliability\n\n- **Uptime\
      \ SLO**: 99.9% availability (43.2 min downtime/month max)\n- **Error Rate**:\
      \ < 0.1% failed requests\n- **Recovery Time**: < 5 minutes for service restart\n\
      \n### Resource Constraints\n\n- **Memory**: < [X]MB per instance\n- **CPU**:\
      \ < [X]% average utilization\n- **Storage**: Data growth < [X]GB per month\n\
      \n### Accessibility Criteria\n\n- **WCAG Compliance**: Meet WCAG 2.1 Level AA\
      \ standards\n- **Keyboard Navigation**: All features accessible via keyboard\n\
      - **Screen Readers**: Compatible with NVDA, JAWS, VoiceOver\n- **Color Contrast**:\
      \ Minimum 4.5:1 for normal text, 3:1 for large text\n- **Focus Indicators**:\
      \ Visible focus indicators on all interactive elements\n\n### Monitoring & Observability\n\
      \n- **Metrics**: Key performance indicators tracked (response time, error rate,\
      \ throughput)\n- **Logging**: Structured logging with correlation IDs for distributed\
      \ tracing\n- **Alerting**: Automated alerts for SLO violations and error spikes\n\
      - **Dashboards**: Real-time visibility into system health and business metrics\n\
      - **Distributed Tracing**: End-to-end request tracking across services\n\n---\n\
      \n## User Scenarios & Testing *(mandatory)*\n\n<!--\n  IMPORTANT: User stories\
      \ should be PRIORITIZED as user journeys ordered by importance.\n  Each user\
      \ story/journey must be INDEPENDENTLY TESTABLE - meaning if you implement just\
      \ ONE of them,\n  you should still have a viable MVP (Minimum Viable Product)\
      \ that delivers value.\n\n  Assign priorities (P1, P2, P3, etc.) to each story,\
      \ where P1 is the most critical.\n  Think of each story as a standalone slice\
      \ of functionality that can be:\n  - Developed independently\n  - Tested independently\n\
      \  - Deployed independently\n  - Demonstrated to users independently\n-->\n\n\
      ### User Story 1 - [Brief Title] (Priority: P1)\n\n[Describe this user journey\
      \ in plain language]\n\n**Why this priority**: [Explain the value and why it\
      \ has this priority level]\n\n**Independent Test**: [Describe how this can be\
      \ tested independently - e.g., \"Can be fully tested by [specific action] and\
      \ delivers [specific value]\"]\n\n**Acceptance Scenarios**:\n\n1. **Given**\
      \ [initial state], **When** [action], **Then** [expected outcome]\n2. **Given**\
      \ [initial state], **When** [action], **Then** [expected outcome]\n\n---\n\n\
      ### User Story 2 - [Brief Title] (Priority: P2)\n\n[Describe this user journey\
      \ in plain language]\n\n**Why this priority**: [Explain the value and why it\
      \ has this priority level]\n\n**Independent Test**: [Describe how this can be\
      \ tested independently]\n\n**Acceptance Scenarios**:\n\n1. **Given** [initial\
      \ state], **When** [action], **Then** [expected outcome]\n\n---\n\n### User\
      \ Story 3 - [Brief Title] (Priority: P3)\n\n[Describe this user journey in plain\
      \ language]\n\n**Why this priority**: [Explain the value and why it has this\
      \ priority level]\n\n**Independent Test**: [Describe how this can be tested\
      \ independently]\n\n**Acceptance Scenarios**:\n\n1. **Given** [initial state],\
      \ **When** [action], **Then** [expected outcome]\n\n---\n\n[Add more user stories\
      \ as needed, each with an assigned priority]\n\n### Edge Cases\n\n<!--\n  ACTION\
      \ REQUIRED: The content in this section represents placeholders.\n  Fill them\
      \ out with the right edge cases.\n-->\n\n- What happens when [boundary condition]?\n\
      - How does system handle [error scenario]?\n\n## Requirements *(mandatory)*\n\
      \n<!--\n  ACTION REQUIRED: The content in this section represents placeholders.\n\
      \  Fill them out with the right functional requirements.\n-->\n\n### Functional\
      \ Requirements\n\n- **FR-001**: System MUST [specific capability, e.g., \"allow\
      \ users to create accounts\"]\n- **FR-002**: System MUST [specific capability,\
      \ e.g., \"validate email addresses\"]\n- **FR-003**: Users MUST be able to [key\
      \ interaction, e.g., \"reset their password\"]\n- **FR-004**: System MUST [data\
      \ requirement, e.g., \"persist user preferences\"]\n- **FR-005**: System MUST\
      \ [behavior, e.g., \"log all security events\"]\n- **FR-006**: System MUST encrypt\
      \ sensitive data at rest\n- **FR-007**: System MUST validate all user inputs\
      \ against injection attacks\n- **FR-008**: System MUST implement rate limiting\
      \ on public APIs\n\n*Example of marking unclear requirements:*\n\n- **FR-009**:\
      \ System MUST authenticate users via [NEEDS CLARIFICATION: auth method not specified\
      \ - email/password, SSO, OAuth?]\n- **FR-010**: System MUST retain user data\
      \ for [NEEDS CLARIFICATION: retention period not specified]\n\n### Key Entities\
      \ *(include if feature involves data)*\n\n- **[Entity 1]**: [What it represents,\
      \ key attributes without implementation]\n- **[Entity 2]**: [What it represents,\
      \ relationships to other entities]\n\n## Success Criteria *(mandatory)*\n\n\
      <!--\n  ACTION REQUIRED: Define measurable success criteria.\n  These must be\
      \ technology-agnostic and measurable.\n-->\n\n### Measurable Outcomes\n\n- **SC-001**:\
      \ [Measurable metric, e.g., \"Users can complete account creation in under 2\
      \ minutes\"]\n- **SC-002**: [Measurable metric, e.g., \"System handles 1000\
      \ concurrent users without degradation\"]\n- **SC-003**: [User satisfaction\
      \ metric, e.g., \"90% of users successfully complete primary task on first attempt\"\
      ]\n- **SC-004**: [Business metric, e.g., \"Reduce support tickets related to\
      \ [X] by 50%\"]\n"
  tasks-template.md:
    version: 2.0.0
    content: "---\ntemplate_version: \"2.0.0\"\nlast_updated: \"2026-04-23\"\nbreaking_changes:\
      \ true\nbreaking_change_notes: |\n  - Removed \"Legacy Task Format\" section\n\
      \  - All tasks must use new Phase-based organization\n  - Migration: Convert\
      \ old task lists to Phase 1-3 structure\ndescription: \"Task list template for\
      \ feature implementation\"\n---\n\n# Tasks: [FEATURE NAME]\n\n**Input**: Design\
      \ documents from `/specs/[###-feature-name]/`\n**Prerequisites**: plan.md (required),\
      \ spec.md (required for user stories), research.md, data-model.md, contracts/\n\
      \n**Tests**: The examples below include test tasks. Tests are OPTIONAL - only\
      \ include them if explicitly requested in the feature specification.\n\n**Organization**:\
      \ Tasks are grouped by user story to enable independent implementation and testing\
      \ of each story.\n\n## Format: `[ID] [P?] [Story] Description`\n\n- **[P]**:\
      \ Can run in parallel (different files, no dependencies)\n- **[Story]**: Which\
      \ user story this task belongs to (e.g., US1, US2, US3)\n- Include exact file\
      \ paths in descriptions\n\n## Path Conventions\n\n- **Single project**: `src/`,\
      \ `tests/` at repository root\n- **Web app**: `backend/src/`, `frontend/src/`\n\
      - **Mobile**: `api/src/`, `ios/src/` or `android/src/`\n- Paths shown below\
      \ assume single project - adjust based on plan.md structure\n\n<!--\n  ============================================================================\n\
      \  IMPORTANT: The tasks below are SAMPLE TASKS for illustration purposes only.\n\
      \n  The /speckit.tasks command MUST replace these with actual tasks based on:\n\
      \  - User stories from spec.md (with their priorities P1, P2, P3...)\n  - Feature\
      \ requirements from plan.md\n  - Entities from data-model.md\n  - Endpoints\
      \ from contracts/\n\n  Tasks MUST be organized by user story so each story can\
      \ be:\n  - Implemented independently\n  - Tested independently\n  - Delivered\
      \ as an MVP increment\n\n  DO NOT keep these sample tasks in the generated tasks.md\
      \ file.\n  ============================================================================\n\
      -->\n\n## Phase 1: Setup (Shared Infrastructure)\n\n**Purpose**: Project initialization\
      \ and basic structure\n\n- [ ] T001 Create project structure per implementation\
      \ plan\n- [ ] T002 Initialize [language] project with [framework] dependencies\n\
      - [ ] T003 [P] Configure linting and formatting tools\n\n---\n\n## Phase 2:\
      \ Foundational (Blocking Prerequisites)\n\n**Purpose**: Core infrastructure\
      \ that MUST be complete before ANY user story can be implemented\n\n**⚠️ CRITICAL**:\
      \ No user story work can begin until this phase is complete\n\nExamples of foundational\
      \ tasks (adjust based on your project):\n\n- [ ] T004 Setup database schema\
      \ and migrations framework\n- [ ] T005 [P] Implement authentication/authorization\
      \ framework\n- [ ] T006 [P] Setup API routing and middleware structure\n- [\
      \ ] T007 Create base models/entities that all stories depend on\n- [ ] T008\
      \ Configure error handling and logging infrastructure\n- [ ] T009 Setup environment\
      \ configuration management\n\n**Checkpoint**: Foundation ready - user story\
      \ implementation can now begin in parallel\n\n---\n\n## Phase 3: User Story\
      \ 1 - [Title] (Priority: P1) \U0001F3AF MVP\n\n**Goal**: [Brief description\
      \ of what this story delivers]\n\n**Independent Test**: [How to verify this\
      \ story works on its own]\n\n### Tests for User Story 1 (OPTIONAL - only if\
      \ tests requested) ⚠️\n\n> **NOTE: Write these tests FIRST, ensure they FAIL\
